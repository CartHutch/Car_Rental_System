<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Vehicle | RentalRide</title>
  <link rel="stylesheet" href="/admin_style.css">
  <link rel="stylesheet" href="/inventory_style.css">
  <link rel="stylesheet" href="/admin_add_car.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="adminAddCarApp" hidden>
    <header class="site-header">
      <a href="/admin"><img src="/logo.png" alt="RentalRide" class="logo"></a>
      <div class="user-controls">
        <span class="admin-badge">Admin</span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="inventory-main">
      <a class="back-link" href="/admin">&larr; Back to Dashboard</a>

      <div class="inv-card">
        <div class="inv-head">
          <div class="inv-head-top">
            <div>
              <p class="inv-eyebrow">Manage Inventory</p>
              <h1 class="inv-title">Add New Vehicle</h1>
            </div>
          </div>
        </div>

        <section class="admin-layout add-vehicle-body">
          <form class="admin-panel admin-form" id="addCarForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" name="model" placeholder="Toyota RAV4" autocomplete="off" required>
          </div>

          <div class="form-group">
            <label for="type">Type</label>
            <select id="type" name="type" required>
              <option value="">Select type</option>
              <option value="SUV">SUV</option>
              <option value="Sedan">Sedan</option>
              <option value="Truck">Truck</option>
              <option value="Van">Van</option>
              <option value="Electric">Electric</option>
              <option value="Convertible">Convertible</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="seats">Seats</label>
            <input type="number" id="seats" name="seats" min="1" step="1" placeholder="5" required>
          </div>

          <div class="form-group">
            <label for="price">Daily Price</label>
            <input type="number" id="price" name="price" min="0" step="1" placeholder="89" required>
          </div>
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="Waterloo" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="imageUrl">Image URL</label>
          <input type="url" id="imageUrl" name="image_url" placeholder="https://example.com/car.jpg" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="imageFile">Upload Image</label>
          <div class="file-drop" id="fileDrop">
            <input type="file" id="imageFile" accept="image/*">
            <div class="file-drop-content">
              <strong>Add image file</strong>
              <span id="fileDropText">Drag an image here or click to choose one</span>
            </div>
          </div>
        </div>

        <div class="admin-message" id="adminMessage" role="status"></div>

        <div class="admin-actions">
          <button type="reset" class="btn-secondary">Clear</button>
          <button type="submit" class="btn-primary" id="submitBtn" data-label="Add Vehicle">Add Vehicle</button>
        </div>
          </form>

          <aside class="admin-panel preview-panel">
            <p class="preview-label">Preview</p>
            <article class="preview-card">
              <div class="preview-image" id="previewImage">
                <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
                  <rect x="2" y="7" width="20" height="12" rx="2"/>
                  <path d="M16 7l-1.5-3h-5L8 7"/>
                  <circle cx="6.5" cy="19" r="1.5"/>
                  <circle cx="17.5" cy="19" r="1.5"/>
                </svg>
              </div>
              <div class="preview-body">
                <h2 id="previewModel">Vehicle model</h2>
                <p id="previewMeta">Type · Location · Seats</p>
                <strong id="previewPrice">$0.00 <span>/ day</span></strong>
              </div>
            </article>
          </aside>
        </section>
      </div>
    </main>
  </div>

  <script src="/api.js"></script>
  <script src="/admin_add_car.js"></script>
</body>
</html>
