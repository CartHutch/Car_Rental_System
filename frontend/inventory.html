<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Inventory</title>
  <link rel="stylesheet" href="admin_style.css">
  <link rel="stylesheet" href="inventory_style.css">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="restricted-screen" id="restrictedScreen">
    <svg class="restricted-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
    </svg>
    <p class="restricted-text">Restricted to only administrators</p>
  </div>

  <div id="inventoryApp" hidden>
    <header class="site-header">
      <a href="admin.html"><img src="./logo.png" alt="RentalRide" class="logo"></a>
      <div class="user-controls">
        <span class="admin-badge">Admin</span>
        <button class="btn-logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="inventory-main">
      <a href="admin.html" class="back-link">&larr; Back to Dashboard</a>

      <div class="inv-card">
        <div class="inv-head">
          <div class="inv-head-top">
            <div>
              <h1 class="inv-title">Vehicle Inventory</h1>
              <p class="inv-subtitle" id="invSubtitle"></p>
            </div>
            <button class="btn-add" id="addBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              Add Vehicle
            </button>
          </div>

          <div class="inv-toolbar">
            <div class="inv-search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9fb0" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-3.5-3.5"/></svg>
              <input id="invSearchInput" type="text" placeholder="Search by name, ID, category, or location…" autocomplete="off">
            </div>
            <div class="inv-filters" id="invFilters"></div>
          </div>
        </div>

        <div class="inv-rows" id="invRows"></div>
        <div class="inv-foot"><span id="invCount"></span></div>
      </div>
    </main>
  </div>

  <script src="api.js"></script>
  <script src="inventory_script.js"></script>
</body>
</html>
