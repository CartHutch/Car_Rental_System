<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentalRide</title>
    <link rel="stylesheet" href="home_style.css">
</head>
<body>

<header>
    <div class="header-top">
        <h1>RentalRide</h1>

        <form class="search-box">
            <input type="text" id="searchInput" placeholder="Search car model...">
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- FILTERS -->
    <div class="filter-bar">
        <span class="filter-label">Filter by:</span>

        <select id="filterType">
            <option value="">All Types</option>
        </select>

        <select id="filterSeats">
            <option value="">Any Seats</option>
        </select>

        <select id="filterLocation">
            <option value="">All Locations</option>
        </select>

        <button id="applyFilters" type="button">Apply Filters</button>
        <button id="clearFilters" type="button">Clear</button>
    </div>
</header>

<main>
    <div class="car-grid"></div>
</main>

<script src="home_script.js"></script>

</body>
</html>
